site:
  name: Rapid Insights
  site: 'https://getrapidinsights.com'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: Rapid Insights
    template: '%s — Rapid Insights'
  description: 'I find what is quietly costing your business money, and I fix it. It hides in the waiting, the handoffs and the work done twice. Rapid Insights clears it.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Rapid Insights
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 630
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

ui:
  theme: 'light:only'
