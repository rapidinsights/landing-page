site:
  name: Rapid Insights
  site: 'https://rapidinsightsconsulting.com'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: Rapid Insights
    template: '%s — Rapid Insights'
  description: "I find what's quietly costing your business money, and I fix it. Operational drag is the hidden time, money and capacity lost between the things your business does. Rapid Insights finds it and removes it."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Rapid Insights
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 630
    type: website

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'light:only'
