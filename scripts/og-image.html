<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rapid Insights — OG card</title>
    <style>
      @font-face {
        font-family: 'Lora Variable';
        font-style: normal;
        font-display: block;
        font-weight: 100 900;
        src: url('og-fonts/lora-latin-wght-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Plus Jakarta Sans Variable';
        font-style: normal;
        font-display: block;
        font-weight: 100 900;
        src: url('og-fonts/plus-jakarta-sans-latin-wght-normal.woff2') format('woff2');
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: rgb(1 28 66);
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background-color: rgb(1 28 66);
      }

      .card::before,
      .card::after {
        content: '';
        position: absolute;
        inset: 0;
      }

      /* dot grid */
      .card::before {
        background-image: radial-gradient(circle at center, rgba(250, 245, 239, 0.18) 1px, transparent 1.25px);
        background-size: 24px 24px;
      }

      /* vignette */
      .card::after {
        background-image: radial-gradient(
          ellipse 70% 80% at 40% 50%,
          rgb(1 28 66 / 0) 0%,
          rgb(1 28 66 / 0) 20%,
          rgb(1 28 66) 100%
        );
      }

      .content {
        position: relative;
        z-index: 1;
        height: 100%;
        box-sizing: border-box;
        padding: 84px 80px 76px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: flex-start;
      }

      .headline {
        margin: 0;
        font-family: 'Lora Variable', Georgia, serif;
        font-weight: 500;
        font-size: 94px;
        line-height: 1.1;
        letter-spacing: -0.015em;
        color: #faf5ef;
        text-align: left;
        max-width: 800px;
      }

      .rule {
        width: 64px;
        height: 3px;
        background: rgb(252 163 17);
        margin-bottom: 18px;
      }

      .wordmark {
        font-family: 'Plus Jakarta Sans Variable', system-ui, sans-serif;
        font-weight: 600;
        font-size: 24px;
        line-height: 1;
        letter-spacing: 0.01em;
        color: #faf5ef;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="content">
        <h1 class="headline">You spend more<br />time reacting<br />than leading.</h1>
        <div>
          <div class="rule"></div>
          <div class="wordmark">Rapid Insights</div>
        </div>
      </div>
    </div>
  </body>
</html>
