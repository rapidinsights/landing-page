# Expose Astro dependencies for the flat node_modules Astro expects.
shamefullyHoist: true
# pnpm 11 blocks install scripts unless allowlisted; these two need their native binaries.
allowBuilds:
  esbuild: true
  sharp: true
# Security overrides for transitive copies (pnpm audit): astro-compress pins
# sharp 0.35.3, svgo 4.0 and deepmerge-ts 7, and its `astro: "*"` range otherwise
# installs a second, unpatched Astro 5 beside the site's own. Keep in step with package.json.
overrides:
  astro-compress>astro: ^7.3.1
  sharp: 0.35.4
  svgo: ^4.1.0
  deepmerge-ts: ^8.0.0
