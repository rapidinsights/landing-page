# Netlify is the host, decided 2026-09-09, and this is the only deploy config in
# the repo. The Vercel, Docker and nginx configs were deleted rather than kept in
# step, because only Netlify serves netlify/functions. `pnpm run dev:netlify`
# runs the site with those functions; `pnpm run dev` serves the static site alone.
[build]
  publish = "dist"
  command = "pnpm run build"
[build.processing.html]
  pretty_urls = false
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
