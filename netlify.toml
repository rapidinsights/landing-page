# Netlify is the host, decided 2026-09-09, and this is the only deploy config in
# the repo. The Vercel, Docker and nginx configs were deleted rather than kept in
# step, because only Netlify serves netlify/functions.
[build]
  publish = "dist"
  command = "pnpm run build"
[build.processing.html]
  pretty_urls = false
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# The blog section collapsed into /case-studies on 2026-09-22 (RAP-440); the old
# URLs are in the sitemap Google already crawled, so they redirect rather than 404.
[[redirects]]
  from = "/blog"
  to = "/case-studies"
  status = 301
[[redirects]]
  from = "/blog/case-studies"
  to = "/case-studies"
  status = 301
[[redirects]]
  from = "/blog/tag/*"
  to = "/case-studies/tag/:splat"
  status = 301
